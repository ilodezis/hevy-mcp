<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="robots" content="noindex" />
  <title>Hevy MCP — вход</title>
  <style>
    :root {
      --bg: #0b0d10; --glow-a: rgba(217, 119, 87, .16); --glow-b: rgba(79, 124, 255, .16);
      --card: rgba(20, 23, 28, .86); --border: #242932; --input: #0f1216; --input-border: #2a303a;
      --text: #e9ebf0; --muted: #98a1b0; --faint: #6b7381;
      --tile: #1a1e25; --claude: #e08a6a; --hevy: #6f93ff;
      --accent: #4f7cff; --accent-hover: #3f6ae6; --ring: rgba(79, 124, 255, .45);
      --err-bg: #2a1416; --err-border: #5a2027; --err-text: #ff9ba3;
      --shadow: 0 24px 64px rgba(0, 0, 0, .45);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f5f8; --glow-a: rgba(217, 119, 87, .18); --glow-b: rgba(79, 124, 255, .16);
        --card: rgba(255, 255, 255, .92); --border: #e2e5ea; --input: #fff; --input-border: #d5d9e0;
        --text: #15181d; --muted: #5d6573; --faint: #8a919d;
        --tile: #f1f3f6; --claude: #c96442; --hevy: #3d6bf0;
        --accent: #3d6bf0; --accent-hover: #2f5ad6; --ring: rgba(61, 107, 240, .35);
        --err-bg: #fdecee; --err-border: #f5c2c8; --err-text: #b4232f;
        --shadow: 0 24px 64px rgba(20, 24, 31, .12);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; padding: 24px 16px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background:
        radial-gradient(600px 400px at 15% 0%, var(--glow-a), transparent 70%),
        radial-gradient(600px 400px at 85% 100%, var(--glow-b), transparent 70%),
        var(--bg);
      color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 380px; padding: 32px 28px 26px;
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      box-shadow: var(--shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      animation: rise .4s ease-out both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .pair { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 22px; }
    .app {
      width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center;
      background: var(--tile); border: 1px solid var(--border);
    }
    .app svg { width: 26px; height: 26px; }
    .app.claude { color: var(--claude); }
    .app.hevy { color: var(--hevy); }
    .bridge { display: flex; gap: 5px; }
    .bridge i { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); animation: flow 1.4s infinite ease-in-out; }
    .bridge i:nth-child(2) { animation-delay: .15s; }
    .bridge i:nth-child(3) { animation-delay: .3s; }
    @keyframes flow { 0%, 100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }

    h1 { margin: 0 0 6px; font-size: 21px; line-height: 1.3; font-weight: 650; text-align: center; letter-spacing: -.01em; }
    p.sub { margin: 0 0 22px; color: var(--muted); font-size: 14px; text-align: center; }

    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .field { position: relative; }
    input {
      width: 100%; padding: 12px 46px 12px 14px; border-radius: 12px; border: 1px solid var(--input-border);
      background: var(--input); color: var(--text); font: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
    .peek {
      position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
      width: 34px; height: 34px; border: 0; border-radius: 9px; padding: 0;
      display: grid; place-items: center; background: transparent; color: var(--faint); cursor: pointer;
    }
    .peek:hover { color: var(--text); background: var(--tile); }
    .peek:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
    .peek svg { width: 18px; height: 18px; }
    .peek .off, .peek[aria-pressed="true"] .on { display: none; }
    .peek[aria-pressed="true"] .off { display: block; }

    .submit {
      width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 12px;
      background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
      transition: background .15s, transform .05s, box-shadow .15s;
    }
    .submit:hover { background: var(--accent-hover); }
    .submit:active { transform: translateY(1px); }
    .submit:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--ring); }

    .err {
      margin: 0 0 16px; padding: 11px 13px; border-radius: 12px;
      background: var(--err-bg); border: 1px solid var(--err-border); color: var(--err-text); font-size: 14px;
      animation: shake .35s ease-in-out;
    }
    @keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
    .fine { margin: 16px 0 0; font-size: 12.5px; color: var(--faint); text-align: center; }
    code { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); }

    footer { font-size: 12px; color: var(--faint); }
    @media (max-width: 380px) { .card { padding: 26px 18px 22px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="pair" aria-hidden="true">
      <span class="app claude"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3.5v17M3.5 12h17M6 6l12 12M18 6 6 18"/></svg></span>
      <span class="bridge"><i></i><i></i><i></i></span>
      <span class="app hevy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg></span>
    </div>
    <h1>Hevy MCP</h1>
    <p class="sub">Коннектор Claude ↔ Hevy</p>
    {% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}" />
    <label for="password">Пароль</label>
    <div class="field">
      <input id="password" name="password" type="password" autofocus autocomplete="current-password" required />
      <button class="peek" type="button" aria-label="Показать пароль" aria-pressed="false" aria-controls="password">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.6A9.7 9.7 0 0 1 12 5.5C18 5.5 21.5 12 21.5 12a17 17 0 0 1-3 3.8M6.3 6.9C3.9 8.5 2.5 12 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.2-1"/><path d="M9.9 9.9a2.8 2.8 0 0 0 4.2 4.2"/></svg>
      </button>
    </div>
    <button class="submit" type="submit">Войти</button>
    <p class="fine">Пароль — значение <code>HEVY_MCP_PASSWORD</code> из <code>.env</code></p>
  </form>
  <footer>Hevy MCP · личный коннектор</footer>
  <script>
    (function () {
      var peek = document.querySelector(".peek"), input = document.getElementById("password");
      peek.addEventListener("click", function () {
        var show = input.type === "password";
        input.type = show ? "text" : "password";
        peek.setAttribute("aria-pressed", String(show));
        peek.setAttribute("aria-label", show ? "Скрыть пароль" : "Показать пароль");
        input.focus();
      });
    })();
  </script>
</body>
</html>
