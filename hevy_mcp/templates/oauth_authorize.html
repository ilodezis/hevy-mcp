<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hevy MCP — доступ</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0b0d10; color: #e7e9ee;
      font: 15px/1.5 -apple-system, Segoe UI, Roboto, sans-serif; }
    .card { width: min(92vw, 380px); background: #14171c; border: 1px solid #232830;
      border-radius: 16px; padding: 28px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
    h1 { margin: 0 0 6px; font-size: 20px; }
    p { margin: 0 0 16px; color: #9aa3b2; font-size: 14px; }
    .domain { color: #e7e9ee; font-weight: 600; }
    button { width: 100%; padding: 11px; border: 0; border-radius: 10px;
      background: #4f7cff; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #3f6ae6; }
    .err { padding: 9px 11px; border-radius: 9px; background: #2a1416;
      border: 1px solid #5a2027; color: #ff9ba3; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    {% if error %}
      <h1>Ошибка</h1>
      <div class="err">{{ error }}</div>
    {% else %}
      <h1>Разрешить доступ?</h1>
      <p><span class="domain">{{ redirect_domain }}</span> запрашивает доступ к твоим тренировкам и планам в Hevy (чтение и запись).</p>
      <form method="post" action="/oauth/authorize/approve">
        <input type="hidden" name="client_id" value="{{ client_id }}" />
        <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}" />
        <input type="hidden" name="state" value="{{ state or '' }}" />
        <input type="hidden" name="code_challenge" value="{{ code_challenge or '' }}" />
        <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method or '' }}" />
        <button type="submit">Разрешить</button>
      </form>
    {% endif %}
  </div>
</body>
</html>
